# ReCAD v2.0 CI: Python unit/integration tests + native build where possible.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + deps
        working-directory: v2.0
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2"  # CPU wheels in CI
          pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: v2.0
        run: ruff check src tests scripts
      - name: Unit + integration tests
        working-directory: v2.0
        run: pytest -x -q
      - name: Slow e2e smoke test
        working-directory: v2.0
        run: pytest -m slow -q

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CPU-only; CUDA runner optional on self-hosted)
        working-directory: v2.0/csrc
        run: |
          cmake -S . -B build -DRECAD_HAS_CUDA=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure