science:
  question: Can predictor-only baselines and spatially adaptive models bias-correct coastal SSS across unseen cruises and LMEs?
  hypothesis: A shared model with soft regional adaptation improves LME macro-RMSE over a global point baseline without worsening worst-LME RMSE.
  product_scope: Global coastal SSS; formal North-American grouped evaluation in this stage.
  primary_comparison: Global point residual baseline versus soft spatial-expert residual model.
  acceptance_gate: Lower development LME macro-RMSE and no material degradation on grouped locked test; external remains sealed.
  stopping_rule: Fixed optimizer budget; checkpoint selected only by grouped development LME macro-RMSE.
