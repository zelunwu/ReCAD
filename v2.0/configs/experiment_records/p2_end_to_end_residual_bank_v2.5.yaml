schema_version: 1
experiment_id: p2_end_to_end_residual_bank_v2.5
status: completed_all_five_protocols_thresholds_pending
owner: ReCAD
issue: 81

science:
  question: What deployment-matched end-to-end residual evidence is available for physical SSS and fCO2 error estimation under the frozen final candidates?
  primary_statistic: Distribution-free one-sided 95% upper bound for the 90th percentile across complete-cruise within-cruise q90 absolute errors.
  estimand: Surface grid-month reconstruction error under the frozen target support; observation-equal results remain secondary because product area-time reweighting is not identified by observed locations alone.
  permitted_claim: Residual-bank construction and evidence-gap audit only; this experiment cannot define intended-use thresholds or publish A-D grades.
  stopping_rule: Preserve protocol banks separately and fail final grading closed if any required protocol is unavailable.

