science:
  question: Which finite model families deserve finalist tuning for global coastal SSS and fCO2 under the repaired Issue 61 validation contract?
  hypothesis: Tree ensembles will remain strongest on sparse tabular coastal observations, but a fairly tuned residual MLP or FT-Transformer may improve true-geographic or forward transfer.
  product_scope: Global coastal SSS and fCO2 development evidence only; no independent qualification.
  primary_comparison: Ridge, ExtraTrees, CatBoost, XGBoost, residual MLP, and FT-Transformer against raw/physical, strict-v1 RF, modernized RF, and Issue-61 CatBoost controls.
  acceptance_gate: At least five-percent improvement in two primary outer schemes, no greater than three-percent regression in another scheme, absolute Issue-37 ceilings, and calibrated fixed-coverage risk.
  stopping_rule: Screen the finite frozen matrix; do not expand a family or add temporal/graph context unless the preregistered trigger fires.

