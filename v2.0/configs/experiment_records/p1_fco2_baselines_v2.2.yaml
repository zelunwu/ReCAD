science:
  question: Which practical baseline most reliably improves coastal fCO2 beyond a training-only seasonal-trend climatology under cruise, region, and forward-time shift?
  hypothesis: Environmental residual models provide stable grouped skill; model complexity is accepted only when it improves the preregistered LME-macro criterion.
  product_scope: Global coastal fCO2; North-American grouped cache is the first formal comparison.
  primary_comparison: Seasonal-trend climatology versus Ridge, CatBoost, point MLP, and soft-expert residual models.
  acceptance_gate: Development cruise-equal and LME-macro RMSE improve by at least 5%, at least 70% of supported LMEs have positive skill, worst-LME does not degrade over 10%, and forward/fCO2-band/support-bin skill remain positive.
  stopping_rule: Fixed budget; select only on grouped development metrics.
