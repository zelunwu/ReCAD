outcome:
  completed_utc: 2026-10-15T09:55:52+08:00
  primary_result: Cruise 90% coverage is 0.898 for SSS and 0.901 for fCO2, but shifted coverage falls to 0.788. Complete-domain A/B area is 20.61%/20.97% and D area is 70.47%/69.11% for SSS/fCO2.
  acceptance_gate_passed: false; applicability contract frozen, global shifted-interval qualification failed
  deviations: [Final fCO2 production fit averages the existing Issue-61 leakage-safe cross-fitted SSS partitions; no target or independent labels were newly opened.]
  evidence_grade: corrected-fold development evidence plus complete unlabeled 1993-2025 product geometry
  allowed_claims: The complete flagged product and abstention contract are reproducible and preserve unsupported coasts; A/B is development support status and does not independently validate observation-free waters.
