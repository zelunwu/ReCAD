outcome:
  completed_utc: 2026-09-30T04:45:00Z
  primary_result: The preregistered 27N degradation hypothesis was not supported; adding either 27-28.45N or 26-27N improved grouped-CV latitude-band macro RMSE despite a less than 1 percent development cruise-equal degradation.
  acceptance_gate_changed: false
  allowed_claims:
    - Data south of 27N were not the identified cause of SAB TA degradation under the preregistered rule.
    - The 28.45-30.5N contrast is hypothesis-generating only because the selected candidate family changes at 30.5N.
    - No latitude boundary passes the full P1.3 development gate; locked-test and external-independent performance remain unknown.
