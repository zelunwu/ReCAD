science:
  question: Can predictor-only baselines and spatially adaptive models bias-correct coastal SSS across unseen cruises and LMEs?
  hypothesis: Residual correction can improve cruise-equal and LME-macro error over GLORYS without widespread regional or low-salinity degradation.
  product_scope: North-American-adjacent coastal SSS development evidence; global status cannot be assigned from this cache.
  primary_comparison: Best residual candidate versus unmodified GLORYS background.
  acceptance_gate: At least 5% development improvement in cruise-equal and LME-macro RMSE, positive skill in at least 70% of adequately sampled LMEs, no more than 10% worst-LME degradation, and positive forward-development skill.
  stopping_rule: Fixed optimizer budget; checkpoint selected only by grouped development LME macro-RMSE.
