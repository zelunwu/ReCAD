schema_version: 1
experiment_id: p2_conditional_combination_v2.4
status: preregistered
owner: ReCAD
created_utc: 2026-10-14T17:10:00Z

science:
  question: Can a leakage-safe target-residual coastal-graph adapter or a residual-scale uncertainty head repair the specific graph structure and shifted under-coverage left by Issues 62-63?
  hypothesis: Water-connected residual climatology may recover coherent coastal bias that label-free local context missed, while a covariate-conditioned scale head may rank shifted error better than prediction-only conformal strata.
  product_scope: Corrected-fold SSS/fCO2 development evidence only; no independent qualification.
  stopping_rule: Run only the graph and uncertainty branches explicitly triggered by prior evidence; do not run process-factor combinations, unrestricted ensembles, simulation pretraining, or the failed Issue-42 ST96 implementation.

data:
  manifest_path: configs/p2_conditional_combination_v2.4.json
  prepared_path: C:/backup/phd/data/processed/recad_v2_3/p2_predictor_ablation_v2.3/socat_predictor_matchup_v2.3.parquet
  predictor_cube: C:/backup/phd/data/processed/recad_v2_3/global_coastal_predictor_cube_v2.3.nc
  split_source: C:/backup/phd/data/processed/recad_v2_4/p2_validation_repair_v2.4/splits
  time_range: 1993-2025
  provenance_policy: No new locked, external-independent, or 2026 labels.

splits:
  grouping: Exact Issue-61 cruise, geographic plus 100-km buffer, whole-region, and past-only forward partitions.
  nesting: Graph sources, graph selection, scale-head training, model fitting, and calibration all stay inside the outer fit partition.
  locked_test: Not opened.
  external_independent: Not opened.

model:
  SSS_baseline: Issue-63 S0 CatBoost background-residual finalist.
  fCO2_baseline: Issue-63 F4 ExtraTrees continuous-background residual.
  graph_branch: Four-season water-graph residual propagation from honest inner residuals; 3 decay values x 2 shrinkage values.
  uncertainty_branch: Fixed ExtraTrees log-absolute-error scale head plus standardized grouped conformal calibration.
  untriggered: [process-factor combination, unrestricted point ensemble, masked-field pretraining, simulation pretraining]

evaluation:
  point_metrics: [RMSE, group-equal RMSE, MAE, bias, R2, paired grouped bootstrap]
  uncertainty_metrics: [coverage50, coverage90, width, WIS, fixed-coverage risk]
  diagnostics: [support distance, graph reachability, correction magnitude, LME boundary, seasonal bins, shifted folds]

reproducibility:
  git_commit: preregistration commit to be recorded before training
  environment_lock: v2.0/.venv plus pyproject.toml

