outcome:
  completed_utc: 2026-10-15T04:45:00+08:00
  primary_result: Graph residual adapters and scale-head uncertainty fail. Honest inner-OOF residual complementarity triggers the fCO2 CatBoost/F4 convex ensemble, reducing pooled cruise/geographic/whole-region/forward RMSE from 32.776/54.061/52.834/39.317 to 32.471/52.495/52.504/38.853 uatm.
  acceptance_gate_passed: partial; fCO2 convex ensemble retained for development only, no production promotion
  deviations: [The preregistered screen-only ensemble branch triggered and was therefore evaluated; process combinations and pretraining remained untriggered.]
  evidence_grade: corrected-fold development evidence
  allowed_claims: The fCO2 convex ensemble transfers better than F4 on geographic and forward corrected folds; graph propagation and residual scale heads do not satisfy frozen gates; no branch is independently qualified.
