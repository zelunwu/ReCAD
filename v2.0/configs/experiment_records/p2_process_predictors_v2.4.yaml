science:
  question: Can deployable process proxies or a continuous fCO2 background improve strict geographic, whole-region, or future transfer beyond the Issue-62 tree finalists?
  hypothesis: Missing process information and discontinuous backgrounds constrain transfer more than additional point-model capacity.
  product_scope: Global coastal SSS/fCO2 development evidence only; no independent qualification.
  acceptance_gate: A factor improves at least two intended outer schemes by at least 1%, has paired grouped-bootstrap upper MSE difference below zero, causes no other-scheme regression above 2%, preserves all-support rows, and does not worsen 90% coverage by more than 0.02 or create source-era/boundary artifacts.
  stopping_rule: Test each frozen factor independently; unavailable Chl-a, MLD, and discharge remain explicit negative availability results; no unrestricted feature search or factor combination.

