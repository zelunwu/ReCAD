outcome:
  completed_utc: 2026-10-14T16:50:00Z
  primary_result: No SSS process factor passed. The fCO2 continuous spherical-seasonal-trend background residual passed the frozen screen and reduced three-seed RMSE to 32.760/54.201/52.754/39.263 uatm for cruise/geographic/whole-region/forward, but shifted coverage and product gates still fail.
  acceptance_gate_passed: partial; F4 retained for development only, no production promotion
  deviations: [Chl-a path unavailable, no frozen MLD source, no frozen river-discharge source; each preserved as an unavailable negative result without a training branch]
  invalidation_reason: null
  evidence_grade: corrected-fold development evidence
  allowed_claims: Continuous background modestly improves the frozen fCO2 point finalist; tested deployable process proxies do not transfer consistently; no SSS/fCO2 product is independently qualified.
