science:
  question: Can the P2 point baselines and uncertainty claims survive corrected exposure, geographic, temporal, and nested-calibration rules?
  hypothesis: Corrected evaluation will preserve useful point-baseline ordering but widen uncertainty and reveal lower true geographic and forward skill.
  product_scope: Global coastal SSS and fCO2 development evidence only; no independent qualification.
  primary_comparison: SSS CatBoost residual versus raw GLORYS; fCO2 modernized RF and direct CatBoost versus exact strict-v1 RF.
  acceptance_gate: Zero group/record/time leakage, deployment-only calibration strata, reproducible exposure ledger, corrected 0.25-degree common-grid and uncertainty results.
  stopping_rule: Do not add model families or tune them in Issue 61; archive corrected baselines and pass the repaired contract to Issue 62.

