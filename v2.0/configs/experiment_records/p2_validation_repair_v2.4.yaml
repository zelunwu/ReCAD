  grouping: Complete normalized cruise/platform groups; actual 5-degree geographic blocks with 100-km buffer; complete LME/fixed-neutral regions; three rolling forward windows.
  train: Each outer-training partition is divided by complete group into 80% fit and 20% calibration; no model or upstream component is refit after calibration.
  development: Cruise, geographic, whole-region, and rolling-forward held rows.
  locked_test: No eligible locked label opened; legacy groups found in P2 are reclassified development-only.
  external_independent: No target value opened; eligibility determined by metadata ledger only.
