outcome:
  completed_utc: 2026-10-13T10:36:00Z
  primary_result: SSS CatBoost cruise/geographic/whole-region RMSE 0.921/1.593/2.571 psu; fCO2 best cruise/geographic RMSE 34.38/52.12 µatm. Repaired validation is reusable, but no baseline passes the full product-promotion contract.
  acceptance_gate_passed: true for validation repair and zero leakage; false for model promotion
  deviations:
    - Before formal training, the early two-fold cross-conformal sketch was replaced by a deterministic complete-group 80/20 fit/calibration split to prevent indirect cross-target reuse of calibration groups.
    - Affected complex-family interval claims from Issues 40-42 were withdrawn rather than partially recomputed; fair family reruns are assigned to Issue 62 on the repaired folds.
  invalidation_reason: null
  evidence_grade: development_only
  allowed_claims: Corrected baseline ranking and failure boundaries under cruise, true geographic, whole-region, and rolling-forward development holdouts; no independent qualification or production promotion.
