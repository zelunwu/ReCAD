  config_path: configs/p2_validation_repair_v2.4.json
  config_sha256: 56a7ed5ef6f08eb4f48d1d9a780abca1fe54c59b5103a1762515d4d0f5476704
  inputs: [deployable Issue 41 A2 predictors, GLORYS background SSS, optional ADT for strict-v1 common cases]
  learned_outputs: [SSS, fCO2]
  derived_outputs: [50/90 symmetric conformal intervals, applicability diagnostics]
  loss: RMSE
  sampling: LME-then-cruise balanced except exact strict-v1 RF
  parameter_count: tree ensembles; recorded per model in the archive

training:
  seeds: [61024]
  optimizer_steps: Frozen tree counts in config; no Issue 61 tuning.
  compute_budget: One corrected baseline pass over 5 cruise, 5 geographic, 5 whole-region, and 3 rolling-forward outer partitions.
  checkpoint_selection: No checkpoint selection; fixed budgets preregistered here.
  uncertainty_method: Group-disjoint 20% calibration holdout inside outer training, using prediction bands only.

evaluation:
  primary_metrics: [RMSE, MAE, bias, R2, cruise-equal RMSE]
  group_metrics: [actual geographic block, cruise, whole region, rolling forward, worst LME, 0.25-degree common grid]
  calibration_metrics: [coverage50, coverage90, interval width, WIS, fixed-coverage risk]
  baselines: [raw GLORYS, exact strict-v1 RF, modernized RF, direct CatBoost]

