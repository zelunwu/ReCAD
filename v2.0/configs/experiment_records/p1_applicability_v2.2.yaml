outcome:
  completed_utc: 2026-10-01T12:30:12+08:00
  primary_result: SSS and fCO2 retain environmental k64 support with 9.6% and 11.2% lower normalized selective-risk AUC than their best simple baselines; TA and DIC fail monotonic support-error behavior and retain region-only diagnostic support.
  acceptance_gate_passed: true
  deviations:
    - The first execution stopped before producing outer predictions because some valid in-situ SSS labels lacked a GLORYS background. The frozen strict-input policy was made explicit and the run was restarted from a new preregistration commit.
    - The analysis script initially applied the monotonicity requirement to every target, while the preregistered Issue #24 gate requires at least one method overall. The global gate calculation was corrected without changing OOF predictions, support scores, or target-level decisions.
  invalidation_reason: null
  evidence_grade: A
  allowed_claims: Leakage-safe applicability infrastructure is viable for SSS/fCO2; TA/DIC support grading remains diagnostic and target product decisions remain in Issues 25-28.
