science:
  question: Which label-free support metrics quantify where SSS, fCO2, TA, and DIC predictions are usable?
  hypothesis: Simple geographic and regional support will explain most selective risk; graph or environmental distances are retained only if they improve untouched outer-fold risk coverage.
  product_scope: Applicability infrastructure and 2025-2026 coastal grid-month support indices; no final target product claim.
  primary_comparison: Best complex graph/environment/hybrid method versus best geographic/region baseline.
  acceptance_gate: At least one support method is monotonic in outer error; complex methods require at least 1 percent lower normalized AURC than the best simple baseline without using held labels.
  stopping_rule: Fixed outer schemes, three ridge alphas, k in 8/16/32/64, and radii 25/50/100/200 km; no changes after formal execution begins.

