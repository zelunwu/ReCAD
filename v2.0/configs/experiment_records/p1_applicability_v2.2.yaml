  time_range: labels through 2025 for SSS/fCO2 and 2024 for TA/DIC; grid support for 2025-2026
  spatial_domain: frozen global coastal graph; TA/DIC anchors are North American
  qc_policy: frozen v2.2 target-specific eligibility; the SSS residual probe additionally requires finite GLORYS background SSS
  provenance_policy: predictor-only support features; no held-fold, locked, or external labels in support construction
  aggregation: cruise-grid-month SOCAT and primary 0-5 m carbon observations

