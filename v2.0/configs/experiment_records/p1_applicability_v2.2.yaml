model:
  family: nested grouped ridge residual probe
  config_path: configs/p1_applicability_v2.2.yaml
  config_sha256: recorded by formal runner
  inputs: [sst, background_sss, adt, wind, atmospheric_pco2, position, season, LME, regime]
  learned_outputs: [target-specific outer predictions]
  derived_outputs: [geographic, regional, graph, environmental, and hybrid support risk]
  loss: inner cruise-equal RMSE selection; outer labels untouched until prediction is frozen
  sampling: all eligible frozen records
  parameter_count: target/fold dependent linear design

training:
  seeds: [100]
  optimizer_steps: closed-form iterative LSQR
  compute_budget: one complete deterministic run
  checkpoint_selection: three-fold inner GroupKFold chooses ridge alpha
  uncertainty_method: cross-fitted residual risk and later target-specific conformal calibration

evaluation:
  primary_metrics: [Spearman absolute-error association, monotonic quintile steps, normalized selective-risk AUC]
  group_metrics: [cruise outer, 5-degree spatial block outer, whole-LME outer, forward-time outer]
  calibration_metrics: [risk-coverage curve, retained area]
  baselines: [geographic distance, regional support count]

