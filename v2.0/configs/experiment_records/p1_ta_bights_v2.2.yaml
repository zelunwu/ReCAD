outcome:
  completed_utc: 2026-09-30T03:14:52Z
  sab_status: fail
  mab_status: diagnostic_only
  allowed_claims:
    - SAB does not support a TA product under the frozen regional gate.
    - MAB shows strong development skill relative to Carter and fixed subregion TA-SSS, but uncertainty is overconservative and grouped CV favors the simpler hierarchical relation.
    - Locked-test and external-independent performance remain unknown because their labels are sealed.
