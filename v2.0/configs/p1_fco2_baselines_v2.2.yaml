experiment_id: p1_fco2_baselines_v2.2
framework: configs/p1_framework_v2.2.yaml
data_manifest: configs/frozen/data_manifest_v2.2.json
cache: C:/backup/phd/data/processed/recad_v2_2/na_socat_cache_v2.2.parquet
target: fco2
periods: {core_labels: 1993-2025, provisional_prediction: 2026}
label_filter: f_n > 0
features: [sst, sss, adt, wspd, pco2air, xco2air, latitude, longitude, mon]
split_column: split
group_column: group_key
region_columns: [lme_id, basin_id, regime_id]
candidates:
  - {name: seasonal_trend_climatology, family: shrunk_lme_month_mean, shared_linear_trend: true}
  - {name: ridge_residual, family: ridge, alpha_grid: [0.1, 1.0, 10.0, 100.0]}
  - {name: catboost_residual, family: CatBoost, depth: 8, iterations: 1500, learning_rate: 0.05}
  - {name: point_mlp_residual, family: mlp, hidden: [128, 128], dropout: 0.1}
  - {name: soft_experts_residual, family: mixture_of_experts, experts: 8, top_k: 2, hidden: [128, 128], shrinkage: 0.001}
training:
  seeds: [100, 101, 102]
  steps: 5000
  batch_size: 2048
  optimizer: {name: AdamW, learning_rate: 0.001, weight_decay: 0.0001}
  sampling: equal_cruise_then_equal_LME
  checkpoint_every: 250
  selection: development_LME_macro_RMSE
evaluation:
  metrics: [RMSE, MAE, bias, R2]
  grouped: [cruise, lme_id, regime_id, forward_split, nearest_carbon_km]
  locked_test_openings: 1
  external_access: forbidden_until_P3
development_gate:
  cruise_equal_improvement_vs_climatology: '>= 5%'
  lme_macro_improvement_vs_climatology: '>= 5%'
  positive_skill_lme_fraction_n_ge_100: '>= 70%'
  worst_lme_degradation_vs_climatology: '<= 10%'
  forward_skill: positive_for_all_selected_model_seeds
  fco2_band_skill: positive_for_all_bands
  support_distance_skill: positive_for_all_populated_bins
  decision_if_passed: nominate_for_issue_11_locked_gate


